<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Business Hub — customers, quotes & follow-ups</title>
<link rel="manifest" href="manifest-crm.json">
<meta name="theme-color" content="#12212e">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<style>
  :root{ --ink:#12212e; --accent:#1a6feb; --gold:#c8a24a; --ok:#1a8f4c; --warn:#c0392b;
         --bg:#f7f9fc; --line:#e6ebf1; --side:#1a1330; --side2:#2a2140; --sideink:#d7d3e6; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink);
        background:var(--bg); line-height:1.5; font-size:15px; }
  #app{ display:flex; height:100vh; overflow:hidden; }

  /* ---- Slack-style sidebar ---- */
  #sidebar{ width:250px; flex:0 0 250px; background:var(--side); color:var(--sideink);
            display:flex; flex-direction:column; transition:transform .2s; z-index:40; }
  .ws{ padding:16px 16px 12px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px; }
  .ws .logo{ width:32px; height:32px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; }
  .ws .nm{ font-weight:700; color:#fff; font-size:15px; line-height:1.15; }
  .ws .nm small{ display:block; font-weight:400; color:var(--sideink); font-size:11px; }
  .navwrap{ overflow-y:auto; padding:10px 8px 20px; flex:1; }
  .sec{ font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#8a83a6; margin:14px 10px 4px; }
  .nav{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer;
        color:var(--sideink); font-size:14.5px; text-decoration:none; }
  .nav:hover{ background:var(--side2); color:#fff; }
  .nav.on{ background:var(--accent); color:#fff; }
  .nav .ic{ width:20px; text-align:center; }
  .nav .badge{ margin-left:auto; background:var(--warn); color:#fff; font-size:11px; font-weight:700; border-radius:20px; padding:1px 7px; }
  .nav.on .badge{ background:rgba(255,255,255,.3); }

  /* ---- main ---- */
  #main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #topbar{ height:56px; flex:0 0 56px; background:#fff; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:12px; padding:0 16px; }
  #hamburger{ display:none; font-size:22px; background:none; border:0; cursor:pointer; }
  #topbar h1{ font-size:17px; margin:0; }
  #search{ margin-left:auto; }
  #search input{ border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:inherit; width:220px; }
  .btn{ font:inherit; font-weight:600; border:0; border-radius:8px; cursor:pointer; background:var(--accent); color:#fff; padding:9px 16px; }
  .btn.sec{ background:#eef2f7; color:var(--ink); } .btn.sm{ padding:6px 11px; font-size:13px; }
  .btn.ok{ background:var(--ok);} .btn.warn{ background:var(--warn);} .btn.gold{background:var(--gold);color:#3a2e10;}
  #view{ overflow-y:auto; padding:22px; flex:1; }

  /* ---- shared ---- */
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  @media(max-width:820px){ .tiles{ grid-template-columns:1fr 1fr; } }
  .tile{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .tile .n{ font-size:24px; font-weight:800; } .tile .l{ font-size:12px; color:#6b7b8a; margin-top:2px; }
  .tile.pipe .n{color:var(--accent);} .tile.risk .n{color:var(--warn);} .tile.win .n{color:var(--ok);}
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .card h2{ margin:0 0 12px; font-size:16px; }
  .row{ display:grid; gap:12px; } .r2{grid-template-columns:1fr 1fr;} .r3{grid-template-columns:1fr 1fr 1fr;} .r4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:720px){ .r2,.r3,.r4{ grid-template-columns:1fr; } }
  label.f{ display:block; font-size:11px; font-weight:600; color:#41586b; margin:0 0 3px; }
  input,select,textarea{ font:inherit; font-size:14px; width:100%; padding:9px 10px; border:1px solid #d4dde6; border-radius:8px; background:#fff; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; background:#f7f9fc; color:#6b7b8a; font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:9px 10px; border-bottom:2px solid var(--line); }
  td{ padding:10px; border-bottom:1px solid #f0f3f7; vertical-align:middle; }
  tr.clk{ cursor:pointer; } tr.clk:hover{ background:#f7f9fc; }
  tr.over{ background:#fdf1f0; } tr.due{ background:#fff8ec; }
  .badge2{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .b-lead{background:#eceff2;color:#57606a;} .b-quoted{background:#e7effd;color:#1a6feb;}
  .b-won{background:#e2f2e8;color:#1a8f4c;} .b-lost{background:#f3e5e5;color:#a5493f;}
  .b-over{background:#fbe0dd;color:#c0392b;} .b-due{background:#fdefd0;color:#a5730c;}
  .empty{ text-align:center; color:#8797a5; padding:34px 16px; }
  .empty .big{ font-size:16px; color:#5a6b7b; margin-bottom:6px; }
  .muted{ color:#8797a5; font-size:13px; }
  .pill{ display:inline-block; background:#eef2f7; border-radius:20px; padding:3px 10px; font-size:12px; margin:2px 4px 2px 0; }
  .catrow{ display:grid; grid-template-columns:26px 1fr 80px 96px; gap:10px; align-items:center; padding:8px 10px; border-bottom:1px solid #f0f3f7; }
  .catrow input[type=number]{ padding:6px; text-align:center; }
  .help{ background:#eef4ff; border:1px solid #cfe0ff; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:16px; color:#274b74; }
  .backlink{ color:var(--accent); cursor:pointer; font-size:13px; display:inline-block; margin-bottom:10px; }
  .flex{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .between{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .acts{ display:flex; gap:5px; flex-wrap:wrap; }
  /* auto-fill (read a description / file into the quote) */
  .assist{ border-color:var(--gold); background:#fffdf6; }
  .tagline{ display:inline-block; background:var(--gold); color:#3a2e10; font-weight:700; font-size:10px;
            letter-spacing:.5px; padding:2px 8px; border-radius:20px; vertical-align:middle; margin-left:6px; }
  .found{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .found .chip{ background:#fff; border:1px solid #e3d8b6; border-radius:20px; padding:3px 10px; font-size:12.5px; }
  .found .chip b{ color:#7a5f14; }
  .aok{ color:var(--ok); font-weight:600; } .abad{ color:var(--warn); font-weight:600; }
  /* overlay/modal */
  .overlay{ position:fixed; inset:0; background:rgba(18,33,46,.6); display:none; align-items:center; justify-content:center; padding:16px; z-index:60; }
  .overlay.open{ display:flex; }
  .modal{ background:#fff; border-radius:12px; width:100%; max-width:780px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal .bar{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); gap:8px; flex-wrap:wrap;}
  .modal iframe{ border:0; width:100%; flex:1; min-height:60vh; }
  #scrim{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:35; }

  @media(max-width:760px){
    #sidebar{ position:fixed; top:0; bottom:0; left:0; transform:translateX(-100%); }
    #sidebar.open{ transform:translateX(0); }
    #hamburger{ display:block; }
    #search input{ width:130px; }
    #app{ height:100dvh; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="ws">
      <div class="logo" id="wsLogo">B</div>
      <div class="nm" id="wsName">Your Business<small id="wsTrade">Home services</small></div>
    </div>
    <div class="navwrap" id="navwrap"><!-- nav injected --></div>
    <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8a83a6">
      Built by <strong style="color:#cfc9de">Vivid Static Lab</strong>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button id="hamburger">☰</button>
      <h1 id="viewTitle">Home</h1>
      <div id="search"><input id="q" placeholder="Search customers…"></div>
      <button class="btn sm" id="newBtn">＋ New quote</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<div id="scrim"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="bar">
      <strong id="mTitle">Document</strong>
      <div class="flex">
        <button class="btn sm sec" id="mPrint">Print / Save as PDF</button>
        <button class="btn sm sec" id="mClose">Close</button>
      </div>
    </div>
    <iframe id="mFrame" title="document"></iframe>
  </div>
</div>

<script>
/* =================== data =================== */
const BOOKS = {
  hvac:{label:'HVAC',items:[['Diagnostic / service call',89],['AC tune-up & maintenance',129],['Refrigerant recharge (per lb)',95],['Capacitor replacement',189],['Condenser fan motor',475],['Blower motor replacement',650],['Smart thermostat install',325],['Duct cleaning',450],['New 3-ton AC system installed',6800]]},
  plumbing:{label:'Plumbing',items:[['Service call / diagnostic',79],['Main drain cleaning',250],['Leak detection',225],['Faucet replacement',185],['Toilet replacement',375],['Sump pump replacement',650],['40-gal water heater install',1850],['Tankless water heater install',3900],['Repipe (per fixture)',450]]},
  electrical:{label:'Electrical',items:[['Service call / diagnostic',95],['Outlet / switch replacement',145],['Ceiling fan install',185],['Recessed lighting (per fixture)',125],['Whole-home surge protector',325],['EV charger install',1250],['Generator transfer switch',950],['200A panel upgrade',2400]]},
  roofing:{label:'Roofing',items:[['Roof inspection',150],['Flashing repair',325],['Minor roof repair',450],['Attic ventilation',550],['Skylight install',850],['Gutter replacement (per ft)',12],['Shingle replacement (per square)',375],['Full reroof (avg home)',9500]]},
};
let KEY='crm_v1';           /* becomes crm_<clientId> when a config.json is present */
let CFG=null;              /* per-client config, loaded at boot */
const DEFAULTS={ settings:{business:'Your Business',trade:'hvac',taxRate:7,shopZip:'Gainesville, FL',shopGeo:null,depositPct:50,phone:'',email:''}, pricebook:{}, customers:[], quotes:[], activity:[] };
let S;
function applyConfig(st){ if(!CFG)return st; const c=CFG, s=st.settings;
  if(c.business)s.business=c.business; if(c.trade&&BOOKS[c.trade])s.trade=c.trade;
  if(c.shopZip)s.shopZip=c.shopZip; if(c.taxRate!=null)s.taxRate=c.taxRate; if(c.depositPct!=null)s.depositPct=c.depositPct;
  if(c.businessPhone)s.phone=c.businessPhone; if(c.businessEmail)s.email=c.businessEmail;
  if(c.pricebook){ for(const k in c.pricebook) st.pricebook[k]=c.pricebook[k]; } return st; }
function loadState(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.settings){ if(!s.pricebook||!Object.keys(s.pricebook).length) seedBook(s); if(!s.activity)s.activity=[]; return s; } }catch(e){} const init=JSON.parse(JSON.stringify(DEFAULTS)); seedBook(init); applyConfig(init); return init; }
function seedBook(st){ st.pricebook={}; for(const k in BOOKS){ st.pricebook[k]=BOOKS[k].items.map(it=>({name:it[0],price:it[1]})); } }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function applyTheme(){ if(CFG&&CFG.themeColor){ document.documentElement.style.setProperty('--accent',CFG.themeColor); } }

/* =================== helpers =================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Math.round((+n||0)).toLocaleString('en-US');
const money2=n=>'$'+(Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);
function todayD(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseD(s){ const p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmtD(s){ if(!s)return '—'; return parseD(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return d; }
function book(trade){ return (S.pricebook[trade]||BOOKS[trade].items.map(it=>({name:it[0],price:it[1]}))); }
function cust(id){ return S.customers.find(c=>c.id===id); }
function logAct(text){ S.activity.unshift({id:uid(),when:new Date().toISOString(),text}); S.activity=S.activity.slice(0,60); }

function qTotals(q){
  const sub=(q.items||[]).reduce((s,i)=>s+(+i.qty||1)*(+i.price||0),0)+(+q.tripFee||0);
  const disc=+q.discount||0; const taxable=Math.max(0,sub-disc);
  const tax=taxable*(+S.settings.taxRate||0)/100; const total=taxable+tax;
  const dep=total*((q.depositPct!=null?q.depositPct:S.settings.depositPct)||0)/100;
  return {sub,disc,tax,total,dep};
}
/* follow-up status for a 'quoted' opportunity */
function fuStatus(q){
  if(q.stage==='won')return'won'; if(q.stage==='lost')return'lost'; if(q.stage==='lead')return'lead';
  const due=addDays(q.sent||iso(todayD()), q.followDays!=null?q.followDays:3); const t=todayD();
  if(due<t)return'over'; if(due.getTime()===t.getTime())return'due'; return'quoted';
}
const STAGE_BADGE={lead:'b-lead',quoted:'b-quoted',won:'b-won',lost:'b-lost',over:'b-over',due:'b-due'};
const STAGE_LABEL={lead:'Lead',quoted:'In pipeline',won:'Won',lost:'Lost',over:'Overdue follow-up',due:'Follow up today'};

/* =================== geocoding (offline-safe) =================== */
async function geocode(q){
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q);
  const r=await fetch(url,{headers:{'Accept':'application/json'}}); if(!r.ok)throw 0;
  const d=await r.json(); if(!d.length)throw 0; return d[0];
}
function haversine(a,b){ const R=3958.8,t=x=>x*Math.PI/180; const dLat=t(b.lat-a.lat),dLon=t(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function tripFeeFor(miles){ return miles==null?0:Math.min(120,Math.max(0,Math.round(miles-15)*2)); }

/* =================== navigation shell =================== */
const NAV=[
  {id:'tools',ic:'⧉',label:'All tools menu',href:'index.html'},
  {sec:'Workspace'},
  {id:'home',ic:'🏠',label:'Home (dashboard)'},
  {id:'customers',ic:'👥',label:'Customers'},
  {id:'pipeline',ic:'📋',label:'Quotes & Jobs'},
  {id:'followups',ic:'🔔',label:'Follow-ups',badge:true},
  {id:'schedule',ic:'📅',label:'Schedule'},
  {sec:'Setup'},
  {id:'settings',ic:'⚙️',label:'Settings & pricebook'},
  {id:'help',ic:'❓',label:'How to use this'},
];
function renderNav(){
  const dueCount=S.quotes.filter(q=>['over','due'].includes(fuStatus(q))).length;
  const cur=(location.hash.slice(1).split('/')[0])||'home';
  let h='';
  NAV.forEach(n=>{
    if(n.sec){ h+=`<div class="sec">${n.sec}</div>`; return; }
    const badge=(n.badge&&dueCount)?`<span class="badge">${dueCount}</span>`:'';
    if(n.href){ h+=`<a class="nav" href="${n.href}"><span class="ic">${n.ic}</span>${n.label}</a>`; return; }
    h+=`<a class="nav ${cur===n.id?'on':''}" href="#${n.id}"><span class="ic">${n.ic}</span>${n.label}${badge}</a>`;
  });
  $('navwrap').innerHTML=h;
  $('wsName').firstChild.textContent=S.settings.business||'Your Business';
  $('wsTrade').textContent=(BOOKS[S.settings.trade]||{}).label+' services';
  $('wsLogo').textContent=(S.settings.business||'B').trim().charAt(0).toUpperCase();
}

/* =================== views =================== */
const VIEWS={};
function setTitle(t){ $('viewTitle').textContent=t; }

VIEWS.home=function(){
  setTitle('Home');
  let pipe=0,risk=0,wonMonth=0; const now=new Date();
  S.quotes.forEach(q=>{ const st=fuStatus(q); const tot=qTotals(q).total;
    if(st==='won'){ const d=q.wonAt?new Date(q.wonAt):(q.sent?parseD(q.sent):now);
      if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()) wonMonth+=tot; }
    if(['quoted','due','over','lead'].includes(st)) pipe+=tot;
    if(['due','over'].includes(st)) risk+=tot; });
  const dueList=S.quotes.filter(q=>['due','over'].includes(fuStatus(q)))
     .sort((a,b)=>addDays(a.sent,a.followDays||3)-addDays(b.sent,b.followDays||3));
  const upcoming=S.quotes.filter(q=>q.scheduledDate&&q.stage!=='lost').sort((a,b)=>parseD(a.scheduledDate)-parseD(b.scheduledDate)).slice(0,5);
  $('view').innerHTML=`
    ${S.customers.length===0?`<div class="help">👋 Welcome! Start by adding a customer, or open <b>Settings</b> to put in your business name and prices. Nothing here is online — it all saves on this device.</div>`:''}
    <div class="tiles">
      <div class="tile pipe"><div class="n">${money(pipe)}</div><div class="l">Open pipeline</div></div>
      <div class="tile risk"><div class="n">${money(risk)}</div><div class="l">Needs follow-up now</div></div>
      <div class="tile win"><div class="n">${money(wonMonth)}</div><div class="l">Won this month</div></div>
      <div class="tile"><div class="n">${S.customers.length}</div><div class="l">Customers</div></div>
    </div>
    <div class="card"><div class="between"><h2 style="margin:0">🔔 Follow up today</h2><button class="btn sm sec" onclick="location.hash='followups'">See all</button></div>
      ${dueList.length?`<table><tbody>${dueList.slice(0,6).map(q=>`<tr class="clk" onclick="location.hash='quote/${q.id}'">
        <td><b>${esc(cust(q.customerId)?cust(q.customerId).name:'—')}</b><div class="muted">${esc(q.title||'Quote')}</div></td>
        <td>${money(qTotals(q).total)}</td><td><span class="badge2 ${STAGE_BADGE[fuStatus(q)]}">${STAGE_LABEL[fuStatus(q)]}</span></td></tr>`).join('')}</tbody></table>`
        :`<div class="empty">Nothing to chase right now. 👍</div>`}
    </div>
    <div class="card"><h2>📅 Upcoming jobs</h2>
      ${upcoming.length?`<table><tbody>${upcoming.map(q=>`<tr class="clk" onclick="location.hash='quote/${q.id}'">
        <td>${fmtD(q.scheduledDate)}</td><td><b>${esc(cust(q.customerId)?cust(q.customerId).name:'—')}</b></td>
        <td>${esc(q.title||'Job')}</td><td>${money(qTotals(q).total)}</td></tr>`).join('')}</tbody></table>`
        :`<div class="empty">No jobs scheduled yet. Mark a quote "Won" and set a date to see it here.</div>`}
    </div>
    ${S.activity.length?`<div class="card"><h2>Recent activity</h2>${S.activity.slice(0,8).map(a=>`<div style="padding:6px 0;border-bottom:1px solid #f0f3f7"><span class="muted">${new Date(a.when).toLocaleString()}</span> — ${esc(a.text)}</div>`).join('')}</div>`:''}
  `;
};

VIEWS.customers=function(){
  setTitle('Customers');
  const term=($('q').value||'').trim().toLowerCase();
  const list=S.customers.filter(c=>!term||[c.name,c.phone,c.email,c.address].map(x=>x||'').join(' ').toLowerCase().includes(term))
     .sort((a,b)=>a.name.localeCompare(b.name));
  $('view').innerHTML=`
    <div class="between" style="margin-bottom:14px"><h2 style="margin:0">Customers (${S.customers.length})</h2>
      <button class="btn" onclick="location.hash='customer/new'">＋ Add customer</button></div>
    <div class="card" style="padding:0">
      ${list.length?`<table><thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Quotes</th></tr></thead><tbody>
        ${list.map(c=>`<tr class="clk" onclick="location.hash='customer/${c.id}'">
          <td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'')}</td><td>${esc(c.address||'')}</td>
          <td>${S.quotes.filter(q=>q.customerId===c.id).length}</td></tr>`).join('')}</tbody></table>`
        :`<div class="empty"><div class="big">No customers yet.</div>Tap <b>Add customer</b> to start. Everything stays on this device.</div>`}
    </div>`;
};

VIEWS.customer=function(arg){
  if(arg==='new'||!arg){ return customerForm(null); }
  const c=cust(arg); if(!c){ location.hash='customers'; return; }
  setTitle(c.name);
  const qs=S.quotes.filter(q=>q.customerId===c.id).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  $('view').innerHTML=`
    <span class="backlink" onclick="location.hash='customers'">← All customers</span>
    <div class="card"><div class="between"><h2 style="margin:0">${esc(c.name)}</h2>
      <div class="flex"><button class="btn sec sm" onclick="customerForm('${c.id}')">Edit</button>
      <button class="btn sm" onclick="location.hash='newquote/${c.id}'">＋ New quote</button></div></div>
      <div class="row r3" style="margin-top:6px">

/* ============ auto-fill: read a description, CSV or PDF into the quote ============
   Runs entirely on this device — no upload, no account, works offline (except the
   first PDF, which needs to fetch the PDF reader once).                            */

/* plain-English words that mean each stock service. Services the client adds
   themselves fall back to matching the words in their own name. */
const SYN={
  'AC tune-up & maintenance':['tune-up','tune up','tuneup','maintenance','not cooling','service the ac'],
  'Refrigerant recharge (per lb)':['refrigerant','freon','recharge','low coolant','low on coolant'],
  'New 3-ton AC system installed':['new system','new ac','replace ac','install ac','new unit','replace the unit','system replacement'],
  'Smart thermostat install':['thermostat','nest','ecobee'],
  'Capacitor replacement':['capacitor'],'Duct cleaning':['duct'],'Blower motor replacement':['blower'],
  'Condenser fan motor':['condenser','fan motor'],'Diagnostic / service call':['diagnostic','service call','not working','inspect'],
  '40-gal water heater install':['water heater'],'Tankless water heater install':['tankless'],
  'Main drain cleaning':['drain','clog','clogged','snake the'],'Toilet replacement':['toilet'],
  'Faucet replacement':['faucet'],'Sump pump replacement':['sump'],'Leak detection':['leak'],
  'Repipe (per fixture)':['repipe','re-pipe'],'Service call / diagnostic':['service call','diagnostic','inspect'],
  '200A panel upgrade':['panel','breaker box','service upgrade'],'EV charger install':['ev charger','ev charging','tesla charger','car charger'],
  'Ceiling fan install':['ceiling fan'],'Recessed lighting (per fixture)':['recessed','can light','lighting'],
  'Whole-home surge protector':['surge'],'Generator transfer switch':['generator','transfer switch'],
  'Outlet / switch replacement':['outlet','receptacle','gfci','light switch'],
  'Full reroof (avg home)':['reroof','new roof','replace roof','roof replacement'],
  'Shingle replacement (per square)':['shingle'],'Minor roof repair':['roof repair','repair roof','roof leak'],
  'Gutter replacement (per ft)':['gutter'],'Skylight install':['skylight'],
  'Attic ventilation':['attic','ventilation','soffit vent'],'Roof inspection':['roof inspection','inspect roof'],
  'Flashing repair':['flashing'],
};
/* when both match, the first wins and the second is dropped */
const CONFLICT=[['Tankless water heater install','40-gal water heater install']];
const STOPW=['install','installed','installation','replace','replacement','replaced','service','call','home','with','per','whole','system','unit','your'];
const NUMWORD={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20};
/* quantities that come with a unit: "4 lbs of refrigerant", "18 squares", "120 ft of gutter", "six cans" */
const UNITRE={
  lb:/\b(\d{1,4}(?:\.\d+)?|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty)\s*(?:lbs?\b|pounds?\b)/,
  ft:/\b(\d{1,5}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty)\s*(?:ft\b|feet\b|foot\b|lf\b|linear\b)/,
  square:/\b(\d{1,4}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty)\s*squares?\b/,
  fixture:/\b(\d{1,3}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty)\s*(?:fixtures?|outlets?|receptacles?|cans?|lights?)\b/ };
const ADDR_RE=/\d{1,6}\s+[\w.'-]+(?:\s+[\w.'-]+){0,4}\s+(?:st|street|ave|avenue|rd|road|dr|drive|blvd|boulevard|ln|lane|ct|court|way|pl|place|ter|terrace|cir|circle|pkwy|parkway|hwy|highway|trl|trail)\b\.?(?:\s*(?:apt|unit|ste|#)\s*[\w-]+)?(?:,\s*[A-Za-z][A-Za-z .'-]{0,24}[A-Za-z])?(?:,?\s*[A-Z]{2}\b)?(?:,?\s*\d{5}(?:-\d{4})?)?/i;
const PHONE_RE=/(?:\+?1[\s.-]?)?\(?\b\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}\b/;
const EMAIL_RE=/[\w.+-]+@[\w-]+\.[\w.]{2,}/;

function itemWords(name){
  if(SYN[name]) return SYN[name];
  return name.toLowerCase().replace(/\([^)]*\)/g,' ').split(/[^a-z0-9]+/).filter(w=>w.length>3&&STOPW.indexOf(w)<0);
}
/* how many? "2 thermostats" · "three outlets" · "4 lbs of refrigerant" · "18 squares" */
function qtyFor(low,word,name){
  const idx=low.indexOf(word); if(idx<0) return 1;
  const per=(name.toLowerCase().match(/\(per\s+([a-z]+)/)||[])[1];
  if(per&&UNITRE[per]){ const m=low.slice(Math.max(0,idx-45),idx+word.length+45).match(UNITRE[per]);
    if(m){ const n=NUMWORD[m[1]]||(/^[\d.]+$/.test(m[1])?Math.round(parseFloat(m[1])):0); if(n>0&&n<10000) return n; } }
  const before=low.slice(Math.max(0,idx-16),idx);
  /* the leading [^\d.$] keeps a price ("...plenum - $180.50") from being read as a quantity */
  const d=before.match(/(?:^|[^\d.$])(\d{1,3})\s*(?:x\s*)?[a-z]{0,12}\s*$/);
  if(d){ const n=parseInt(d[1],10); if(n>0&&n<100) return n; }
  const w=before.match(/([a-z]+)\s+$/);
  if(w&&NUMWORD[w[1]]) return NUMWORD[w[1]];
  return 1;
}
function matchPricebook(text,items){
  const low=' '+String(text).toLowerCase().replace(/\s+/g,' ')+' ';
  const hits=[];
  items.forEach((it,i)=>{ const w=itemWords(it.name).filter(k=>k).find(k=>low.indexOf(k)>=0);
    if(w) hits.push({i,name:it.name,qty:qtyFor(low,w,it.name),price:+it.price||0}); });
  CONFLICT.forEach(pair=>{ if(hits.some(h=>h.name===pair[0])){ const j=hits.findIndex(h=>h.name===pair[1]); if(j>=0)hits.splice(j,1); } });
  return hits;
}
/* named work with its own price on the line — reads a supplier estimate or an
   inspection report and brings across items that aren't in the pricebook */
function extractPricedLines(text,taken){
  const out=[],seen={};
  String(text).split(/[\n\r;•]+/).forEach(raw=>{
    const line=raw.replace(/\s+/g,' ').trim(); if(line.length<4||line.length>140) return;
    const m=line.match(/^[-*•\d.)\s]*([A-Za-z][^$]{2,70}?)\s*[:\-–—]?\s*\$\s?([\d,]+(?:\.\d{1,2})?)$/);
    if(!m) return;
    const name=m[1].replace(/[\s.:\-–—]+$/,'').trim(), price=parseFloat(m[2].replace(/,/g,''));
    if(!name||!(price>0)) return;
    const key=name.toLowerCase(); if(seen[key]||taken.indexOf(key)>=0) return; seen[key]=1;
    out.push({name,price,qty:1});
  });
  return out.slice(0,12);
}
function parseCSV(text){
  const rows=[]; let f='',row=[],q=false; text=String(text).replace(/\r\n?/g,'\n');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';} else f+=c; } }
  if(f.length||row.length){row.push(f);rows.push(row);}
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]==null?'':r[i]).trim());return o;});
}
/* a job sheet / price list: match rows to the pricebook where possible, else add as custom lines */
function applyCSVRows(text){
  const rows=parseCSV(text); if(!rows.length) return {count:0,contact:{}};
  const cols=Object.keys(rows[0]), find=re=>cols.find(c=>re.test(c.toLowerCase()));
  const cCust=find(/customer|client/)||find(/^name$/), cAddr=find(/address|property|site|location/),
        cPhone=find(/phone|mobile|cell/), cEmail=find(/e-?mail/),
        cItem=find(/item|service|descr|work|task|job/), cQty=find(/qty|quantit|count/), cPrice=find(/price|rate|amount|cost|total/);
  const contact={};
  if(cCust&&rows[0][cCust]) contact.name=rows[0][cCust];
  if(cAddr&&rows[0][cAddr]) contact.addr=rows[0][cAddr];
  if(cPhone&&rows[0][cPhone]) contact.phone=rows[0][cPhone];
  if(cEmail&&rows[0][cEmail]) contact.email=rows[0][cEmail];
  const items=book(draft.trade); let count=0;
  rows.forEach(r=>{
    const name=String((cItem?r[cItem]:r[cols[0]])||'').trim(); if(!name) return;
    const price=cPrice?parseFloat(String(r[cPrice]).replace(/[$,\s]/g,'')):NaN;
    const qty=cQty?(parseInt(r[cQty],10)||1):1;
    const bi=items.findIndex(b=>b.name.toLowerCase()===name.toLowerCase());
    if(bi>=0){ draft.items[bi]={name:items[bi].name,qty,price:isNaN(price)?+items[bi].price:price}; count++; return; }
    if(price>0){ draft.extras.push({name,price,qty}); count++; }
  });
  return {count,contact};
}
function extractContact(text){
  const out={}, flat=String(text).replace(/\s+/g,' ').trim();
  const low=flat.toLowerCase();
  const known=S.customers.find(c=>c.name&&c.name.trim().length>2&&low.indexOf(c.name.trim().toLowerCase())>=0);
  if(known){ out.customerId=known.id; out.name=known.name; }
  if(!out.name){
    const pats=[/(?:[Cc]ustomer|[Cc]lient|[Cc]ontact|[Nn]ame)\s*[:\-]\s*([A-Z][\w'’-]+(?:\s+[A-Z][\w'’-]+){0,2})/,
                /\b([A-Z][a-z'’-]+\s+[A-Z][a-z'’-]+)\s+(?:at|lives|needs|wants|called|asked)\b/,
                /^([A-Z][a-z'’-]+\s+[A-Z][a-z'’-]+)\b/];
    for(let i=0;i<pats.length;i++){ const m=flat.match(pats[i]); if(m){ out.name=m[1].trim(); break; } }
  }
  const a=flat.match(ADDR_RE); if(a) out.addr=a[0].replace(/\s+,/g,',').trim();
  const p=flat.match(PHONE_RE); if(p) out.phone=p[0].trim();
  const e=flat.match(EMAIL_RE); if(e) out.email=e[0].trim();
  return out;
}
/* pdf.js is fetched only when someone actually picks a PDF — keeps boot instant and offline-clean */
let pdfPromise=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfPromise) return pdfPromise;
  pdfPromise=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>res(window.pdfjsLib);
    s.onerror=()=>{ pdfPromise=null; rej(new Error('Reading PDFs needs internet the first time. Copy the text out and paste it above instead.')); };
    document.head.appendChild(s);
  });
  return pdfPromise;
}
async function readUpload(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf'){
    const lib=await loadPdfJs();
    lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise; let t='';
    for(let p=1;p<=pdf.numPages;p++){ const pg=await pdf.getPage(p); t+=(await pg.getTextContent()).items.map(x=>x.str).join(' ')+'\n'; }
    if(!t.replace(/\s/g,'')) throw new Error('That PDF is a scan (no text inside it). Type the details above instead.');
    return {kind:'text',text:t};
  }
  return {kind:ext==='csv'?'csv':'text',text:await file.text()};
}

function applyContact(c){
  const chips=[];
  if(c.customerId){
    const cc=cust(c.customerId)||{};
    $('qCust').value=c.customerId; $('newCustFields').style.display='none';
    chips.push('Existing customer <b>'+esc(cc.name)+'</b>');

  } else if(c.name){
    $('qCust').value='__new'; $('newCustFields').style.display='grid';
    if($('ncName'))$('ncName').value=c.name;
    chips.push('New customer <b>'+esc(c.name)+'</b>');
  }

  if(c.email){ if(isNew&&$('ncEmail'))$('ncEmail').value=c.email; chips.push('Email <b>'+esc(c.email)+'</b>'+(isNew?'':' (not saved to their record)')); }
  if(c.addr){ $('qAddr').value=c.addr; if(isNew&&$('ncAddr'))$('ncAddr').value=c.addr; chips.push('Address <b>'+esc(c.addr)+'</b>'); }
  return chips;
}
async function runAutoFill(){
  const st=$('aiStatus'), typed=$('aiText').value||'', f=$('aiFile').files[0];
  st.innerHTML='Reading…'; $('aiFound').innerHTML='';
  try{
    let fileText='',csv=null;
    if(f){ const r=await readUpload(f); fileText=r.text; if(r.kind==='csv')csv=r.text; }
    const prose=(typed+(csv?'':'\n'+fileText)).trim();
    if(!prose&&!csv){ st.innerHTML='<span class="abad">Paste a few words, or choose a file first.</span>'; return; }
    snapAI();
    const rows=csv?applyCSVRows(csv):{count:0,contact:{}};
    const hits=matchPricebook(prose,book(draft.trade));
    hits.forEach(h=>{ draft.items[h.i]={name:h.name,qty:h.qty,price:h.price}; });
    const taken=hits.map(h=>h.name.toLowerCase());
    const priced=extractPricedLines(prose,taken);
    priced.forEach(p=>draft.extras.push(p));
    renderQCat();

    const c=Object.assign(extractContact(prose||typed),rows.contact);
    if(!c.customerId&&c.name){ const m=S.customers.find(x=>x.name.trim().toLowerCase()===c.name.trim().toLowerCase()); if(m)c.customerId=m.id; }
    const chips=applyContact(c);
    hits.forEach(h=>chips.push(esc(h.name)+(h.qty>1?' <b>×'+h.qty+'</b>':'')));
    priced.forEach(p=>chips.push(esc(p.name)+' <b>'+money2(p.price)+'</b> <span class="muted">custom</span>'));
    if(rows.count) chips.push('<b>'+rows.count+'</b> line(s) from the file');
    $('aiFound').innerHTML=chips.map(t=>'<span class="chip">'+t+'</span>').join('');

    const n=hits.length+priced.length+rows.count;
    st.innerHTML = n ? '<span class="aok">✓ Filled in</span> — '+n+' line(s). Look it over below, change anything, then Save.'
                     : '<span class="abad">No services matched.</span> Tick the work by hand below (or add it in Settings → pricebook).';
    $('aiUndo').style.display='inline-block';
    if(c.addr&&navigator.onLine) qLookupAddr();
    $('qCat').scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){
    st.innerHTML='<span class="abad">'+esc(e&&e.message?e.message:'Could not read that file.')+'</span>';
  }
}

function exportData(){ const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const slug=(S.settings.business||'business').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'business';
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=slug+'-backup-'+iso(todayD())+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),5000); }
function importData(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.settings)throw 0; S=d; if(!S.activity)S.activity=[]; save(); alert('Backup imported.'); renderNav(); location.hash='home'; router(); }catch(err){ alert('That file was not a valid backup.'); } }; r.readAsText(f); }
function resetData(){ if(confirm('Erase all data on this device and start fresh?')){ localStorage.removeItem(KEY); S=loadState(); save(); renderNav(); location.hash='home'; router(); } }

/* =================== boot =================== */
function router(){ const h=location.hash.slice(1)||'home'; const [v,arg]=h.split('/'); (VIEWS[v]||VIEWS.home)(arg); renderNav(); closeSide(); window.scrollTo(0,0); if($('view'))$('view').scrollTop=0; }
function closeSide(){ $('sidebar').classList.remove('open'); $('scrim').style.display='none'; }
$('hamburger').onclick=()=>{ const o=$('sidebar').classList.toggle('open'); $('scrim').style.display=o?'block':'none'; };
$('scrim').onclick=closeSide;
$('newBtn').onclick=()=>location.hash='newquote';
$('q').addEventListener('input',()=>{ if((location.hash.slice(1).split('/')[0])==='customers')VIEWS.customers(); else location.hash='customers'; });
$('mClose').onclick=()=>$('overlay').classList.remove('open');
$('overlay').onclick=e=>{ if(e.target===$('overlay'))$('overlay').classList.remove('open'); };
$('mPrint').onclick=()=>{ $('mFrame').contentWindow.focus(); $('mFrame').contentWindow.print(); };
window.addEventListener('hashchange',router);
async function init(){
  try{ const r=await fetch('config.json',{cache:'no-store'}); if(r.ok){ CFG=await r.json(); if(CFG.clientId) KEY='crm_'+CFG.clientId; } }catch(e){}
  S=loadState(); applyTheme(); renderNav(); router();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
init();
</script>
